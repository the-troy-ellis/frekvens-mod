[env:attiny1614]
platform  = atmelmegaavr
board     = ATtiny1614
framework = arduino

; 10 MHz (20 MHz internal oscillator ÷2) — in spec at 3.3V on the 1-series.
; 20 MHz would require 4.5V, so it is NOT used here.
board_build.f_cpu = 10000000L

; The ATtiny1614 board definition ships
;   extra_flags = -DARDUINO_attinyxy4 -DMILLIS_USE_TIMERD0 -DUARTBAUD5V
; and that MILLIS_USE_TIMERD0 collides with the MILLIS_USE_TIMERNONE we need in
; build_flags (TCB0 is the /OE brightness PWM, so millis() has to be off).
; core_parameters.h then hard-errors. Restate extra_flags without the millis
; define — keeping the other two, which the core still requires. NB the error
; that collision produces reads "MILLIS_USE_TIMERB5 and another timer are set",
; which is a copy-paste bug in megaTinyCore's own #error text (the TIMERD0 block
; names TIMERB5); the part has no TCB5, so ignore the number and read it as
; TIMERD0.
board_build.extra_flags = -DARDUINO_attinyxy4 -DUARTBAUD5V

; OSCCFG selects the 20 MHz base oscillator; the core prescales it to 10 MHz.
; UPDI stays enabled so the chip remains reprogrammable. BOD enabled at 2.6V
; (continuous) so the chip holds in reset until VCC is stable → clean cold-start.
board_fuses.OSCCFG  = 0x02   ; 20 MHz base oscillator (prescaled to 10 MHz)
; RSTPINCFG is SYSCFG0 bits[3:2] — GPIO=0b00, UPDI=0b01, RESET=0b10. Only the
; UPDI setting keeps the chip reprogrammable over the single PA0 wire; both GPIO
; and RESET cost UPDI and need 12V HV programming to recover.
;   0xC5 = 1100_0101 → bits[3:2] = 0b01 = UPDI  ← correct, what we burn
;   0xC8 = 1100_1000 → bits[3:2] = 0b10 = RESET ← would disable UPDI. Never burn.
; Verified three ways (2026-08-19): Microchip's own iotn1614.h defines
; FUSE_RSTPINCFG_gm=0x0C at group position 2 with RSTPINCFG_UPDI_gc=(0x01<<2);
; megaTinyCore 2.6.11 boards.txt builds this part's SYSCFG0 as
; 0b1100{resetpinbits}0{eesavebit} with resetpinbits=01 and eesavebit=1, i.e.
; exactly 0xC5, and has the resetpinbits=10 menu entry commented out precisely
; so nobody can select it; and a field chip read back 0xC5 on 2026-07-28.
; The low bit is EESAVE=1 (preserve EEPROM across reprogramming), which is also
; what megaTinyCore defaults to — 0xC8 would have silently cleared it too.
; PA0 is ONE shared pin — UPDI *or* RESET *or* GPIO, never two at once — so the
; old "UPDI enabled, RESET pin kept as RESET" annotation was self-contradictory.
; Do not be tempted to take PA0 for an external RESET to work around the
; cold-start issue either: BOD already holds the chip until VCC is good, and
; while the part IS in reset PA5 (/OE) floats, which is precisely the state
; that lets the drivers light power-up garbage. See docs/wiring.md.
board_fuses.SYSCFG0 = 0xC5   ; RSTPINCFG=UPDI, EESAVE=1 — see above before changing
board_fuses.SYSCFG1 = 0x07   ; 64 ms power-up delay (safe for capacitive supplies)
; BODCFG fields (per iotn1614.h): LVL bits[7:5], SAMPFREQ bit[4],
; ACTIVE bits[3:2], SLEEP bits[1:0].
;   0x45 = 0100_0101 → LVL=2 (2.6V), SAMPFREQ=1kHz, ACTIVE=Enabled, SLEEP=Enabled
; This is what megaTinyCore burns from the Arduino IDE menu, and what a live
; chip read back over UPDI on 2026-08-19. The previous hand-written 0x54 agreed
; on the two settings that matter here — 2.6V and ACTIVE=Enabled (continuous),
; which is what the cold-start hold in docs/wiring.md relies on — but had
; SLEEP=Disabled and SAMPFREQ=125Hz, i.e. the field values packed wrong. Inert
; either way (this firmware never sleeps), but there is no reason to differ from
; the configuration actually running in the field.
board_fuses.BODCFG  = 0x45   ; BOD 2.6V, active=continuous, sleep=enabled
board_fuses.APPEND  = 0x00
board_fuses.BOOTEND = 0x00

; UPDI programmer via SerialUPDI (USB-serial adapter + 470 Ω resistor on TX→UPDI).
; Change upload_port to match your serial adapter:
;   Linux   /dev/ttyUSB0        (CH340/CP2102/FTDI; check with `ls /dev/ttyUSB*`)
;           /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0 is the stable
;           alias for a CH340 — survives replugging, but CH340 clones carry no
;           unique serial, so it is ambiguous if two are plugged in at once.
;   macOS   /dev/cu.usbserial-*
upload_protocol = serialupdi
upload_port     = /dev/ttyUSB0
upload_speed    = 460800

; ⚠ `pio run -t upload` does NOT work as of 2026-08-19. PlatformIO drives
; serialupdi through avrdude, and avrdude fails UPDI link init on this setup at
; both 460800 and 230400:
;     Error: UPDI link initialization failed
;     Error: initialization failed  (rc = -1)
; This is an avrdude problem, not a wiring one — megaTinyCore's own SerialUPDI
; implementation (pymcuprog) talks to the same chip over the same CH340 on the
; same port without complaint, and was used to flash and verify successfully.
; The build above is fine; only the upload step is affected.
;
; Until avrdude is sorted, build with pio and flash with prog.py:
;     pio run
;     python3 "$MEGATINYCORE/tools/prog.py" -t uart -u /dev/ttyUSB0 -b 230400 \
;         -d attiny1614 -a write -f .pio/build/attiny1614/firmware.hex
; where $MEGATINYCORE is the installed core, e.g.
;     ~/.arduino15/packages/megaTinyCore/hardware/megaavr/2.6.11
; Add --fuses_print (no -a/-f) to read fuses back without writing anything.

; Alternatively, use a jtag2updi programmer (Arduino Nano flashed as UPDI bridge):
; upload_protocol = jtag2updi
; upload_port     = /dev/ttyUSB0
; upload_speed    = 115200

; STATUS (2026-08-19): `pio run` builds clean against atmelmegaavr +
; megaTinyCore 2.6.11 — 1916 B flash, 1050 B RAM. Both of the issues noted on
; 2026-07-11 are fixed: the MILLIS_USE_TIMERD0 collision by the extra_flags
; override above, and the setup()/loop() link failure by including <Arduino.h>
; in src/main.cpp (it declares them extern "C"; the Arduino IDE injects that
; include into .ino files automatically, PlatformIO does not — which is exactly
; why the IDE path worked and this one did not). It was never an LTO problem.
; The Arduino IDE sketch in ../arduino/frekvens_panel/ remains valid.
build_flags =
    -DF_CPU=10000000L
    -DMILLIS_USE_TIMERNONE   ; disable millis() (we use TCB0 for OE brightness PWM)
    -Os
    -Wall
