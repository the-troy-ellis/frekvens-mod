[env:xiao_esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.filesystem = littlefs

; Native USB CDC for Serial console (the XIAO S3 has no USB-UART bridge chip).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DASYNC_TCP_SSL_ENABLED=0

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
    knolleary/PubSubClient @ ^2.8
    ; ESP32-S3 needs S3-aware forks of AsyncTCP / ESPAsyncWebServer.
    ; The mathieucarbou maintained forks support the S3 cleanly.
    mathieucarbou/AsyncTCP @ ^3.2.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    tzapu/WiFiManager @ ^2.0.17

; XIAO ESP32-S3 has 8MB flash — give LittleFS a generous partition for the
; web UI plus uploaded images/animations.
board_build.partitions = default_8MB.csv

[env:xiao_esp32s3_ota]
extends      = env:xiao_esp32s3
upload_protocol = espota
upload_port  = frekvens.local
upload_flags = --auth=frekvens-ota
