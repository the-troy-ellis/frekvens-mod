[env:attiny85]
platform  = atmelavr
board     = attiny85
framework = arduino

# 16MHz via internal PLL (no external crystal needed)
board_build.f_cpu = 16000000L
board_fuses.lfuse = 0xE1  ; internal 8MHz oscillator, PLL enabled, no divider
board_fuses.hfuse = 0xDF  ; keep RESET pin (no DWEN, no CKOPT)
board_fuses.efuse = 0xFF

# ISP programmer — change to your programmer (usbasp, arduinoisp, etc.)
upload_protocol = usbasp
upload_flags = -B4

build_flags =
    -DF_CPU=16000000L
    -DSERIAL_BAUD=115200

# Strict size warnings — ATtiny85 has 8KB flash, 512B SRAM
build_unflags = -Os
build_flags   = -Os -Wall -Wextra
