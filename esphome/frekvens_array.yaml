# ESPHome alternative firmware for Frekvens Array
# Provides Home Assistant integration via ESPHome native API.
# Flash with: esphome run frekvens_array.yaml
#
# NOTE: This is the ESPHome alternative to the custom Arduino firmware.
# It provides HA integration + OTA but does NOT include the full web UI,
# the effects/games/zones engines, or Raid 16.
# For any of that, use the PlatformIO firmware in ../esp32/
#
# Board and link settings track esp32/src/config.h — a Seeed XIAO ESP32-S3
# talking to the ATtiny1614 chain on D0/D1 at 250 kBd. This path is kept in
# sync on paper but is not exercised by the host tests, so treat it as
# untested against current panel firmware.

substitutions:
  device_name: frekvens-array
  friendly_name: Frekvens Array
  num_panels: "1"     # Change to match your chain length (1–4)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - frekvens_component.h

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: arduino

logger:
  level: INFO

# Single api: block — encryption key AND custom services must live here together.
# ESPHome silently drops the first api: key if two appear at the top level.
api:
  encryption:
    key: !secret api_key
  services:
    # Call from HA: service: esphome.frekvens_array_display_text
    #               data: {text: "Hello!", scroll_ms: 80, brightness: 15}
    - service: display_text
      variables:
        text: string
        scroll_ms: int
        brightness: int
      then:
        - lambda: |-
            id(frekvens_panel)->displayText(text.c_str(), brightness, scroll_ms);

    # Call from HA: service: esphome.frekvens_array_display_off
    - service: display_off
      then:
        - lambda: |-
            id(frekvens_panel)->clear();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Frekvens Setup"
    password: "frekvens1"

captive_portal:

# UART to the ATtiny1614 panel chain.
# Must match esp32/src/config.h and attiny1614/src/uart.cpp: the XIAO exposes
# these as D0/D1, and the panel firmware runs the link at 250 kBd.
uart:
  id: chain_uart
  tx_pin: GPIO1
  rx_pin: GPIO2
  baud_rate: 250000

# Custom component drives the panel chain
custom_component:
  - lambda: |-
      auto frekvens = new FrekvensComponent(id(chain_uart), ${num_panels});
      App.register_component(frekvens);
      return {frekvens};
    components:
      - id: frekvens_panel

# Light entity — brightness + on/off synced to HA
light:
  - platform: custom
    lambda: |-
      auto light = new FrekvensLight(id(frekvens_panel));
      return {light};
    lights:
      - name: ${friendly_name}
        id: frekvens_light
